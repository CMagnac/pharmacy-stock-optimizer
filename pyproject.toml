[project]
name = "pharmacy-stock-optimizer"
version = "0.1.0"
description = "Data-driven pharmacy stock monitoring and optimization system."
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
